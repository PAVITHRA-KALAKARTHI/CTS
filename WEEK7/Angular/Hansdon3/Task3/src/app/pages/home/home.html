<div class="container">

<h1>{{ portalName }}</h1>

<p>
Welcome to the Student Course Portal.
Browse courses and manage your profile.
</p>

<div class="stats">

<div class="card">
<h3>Courses Available</h3>
<p>{{ coursesAvailable }}</p>
</div>

<div class="card">
<h3>Enrolled</h3>
<p>{{ enrolledCourses }}</p>
</div>

<div class="card">
<h3>GPA</h3>
<p>{{ gpa }}</p>
</div>

</div>

<hr>

<button
[disabled]="!isPortalActive"
(click)="onEnrollClick()">

Enroll Now

</button>

<p>{{ message }}</p>

<hr>

<label>Search Course</label>

<br><br>

<input
type="text"
[(ngModel)]="searchTerm"
placeholder="Search here">

<p>
Searching for:
<strong>{{ searchTerm }}</strong>
</p>

</div>
