<div class="form-container">

    <div class="form-card">

        <h2>Student Enrollment Form</h2>

        <p class="subtitle">
            Complete the form below to enroll in a course.
        </p>

        <form
            #enrollForm="ngForm"
            (ngSubmit)="onSubmit(enrollForm)">

            <!-- Student Name -->

            <div class="form-group">

                <label>Student Name</label>

                <input
                    type="text"
                    name="studentName"
                    ngModel
                    required
                    minlength="3"
                    #nameCtrl="ngModel"
                    placeholder="Enter your full name">

                <span
                    class="error"
                    *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">

                    Name is required

                </span>

                <span
                    class="error"
                    *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">

                    Name must be at least 3 characters

                </span>

            </div>

            <!-- Email -->

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="studentEmail"
                    ngModel
                    required
                    email
                    #emailCtrl="ngModel"
                    placeholder="example@gmail.com">

                <span
                    class="error"
                    *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">

                    Email is required

                </span>

                <span
                    class="error"
                    *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">

                    Enter a valid email

                </span>

            </div>

            <!-- Course ID -->

            <div class="form-group">

                <label>Course ID</label>

                <input
                    type="number"
                    name="courseId"
                    ngModel
                    required
                    #courseCtrl="ngModel"
                    placeholder="Enter Course ID">

                <span
                    class="error"
                    *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">

                    Course ID is required

                </span>

            </div>

            <!-- Semester -->

            <div class="form-group">

                <label>Preferred Semester</label>

                <select
                    name="preferredSemester"
                    ngModel
                    required
                    #semesterCtrl="ngModel">

                    <option value="">Select Semester</option>
                    <option>Odd</option>
                    <option>Even</option>

                </select>

                <span
                    class="error"
                    *ngIf="semesterCtrl.touched && semesterCtrl.errors?.['required']">

                    Please select a semester

                </span>

            </div>

            <!-- Checkbox -->

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="agree"
                    name="agreeToTerms"
                    ngModel
                    required
                    #agreeCtrl="ngModel">

                <label for="agree">

                    I agree to the Terms and Conditions

                </label>

            </div>

            <span
                class="error"
                *ngIf="agreeCtrl.touched && agreeCtrl.errors?.['required']">

                You must accept the terms

            </span>

            <button
                type="submit"
                [disabled]="enrollForm.invalid">

                Submit Enrollment

            </button>

            <button
                type="button"
                class="reset-btn"
                (click)="enrollForm.resetForm()">

                Reset

            </button>

        </form>

        <div
            class="success"
            *ngIf="submitted">

            Enrollment request submitted successfully!

        </div>

    </div>

</div>
