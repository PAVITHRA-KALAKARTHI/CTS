<div class="form-container">

    <div class="form-card">

        <h2>Student Enrollment Form</h2>

        <p class="subtitle">
            Complete the form below to enroll in a course.
        </p>

        <form
            #enrollForm="ngForm"
            (ngSubmit)="onSubmit(enrollForm)">

            <!-- Student Name -->

            <div class="form-group">

                <label>Student Name</label>

                <input
                    type="text"
                    name="studentName"
                    ngModel
                    required
                    placeholder="Enter your full name">

            </div>

            <!-- Email -->

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="studentEmail"
                    ngModel
                    required
                    placeholder="example@gmail.com">

            </div>

            <!-- Course ID -->

            <div class="form-group">

                <label>Course ID</label>

                <input
                    type="number"
                    name="courseId"
                    ngModel
                    required
                    placeholder="Enter Course ID">

            </div>

            <!-- Semester -->

            <div class="form-group">

                <label>Preferred Semester</label>

                <select
                    name="preferredSemester"
                    ngModel
                    required>

                    <option value="">Select Semester</option>
                    <option>Odd</option>
                    <option>Even</option>

                </select>

            </div>

            <!-- Checkbox -->

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="agree"
                    name="agreeToTerms"
                    ngModel>

                <label for="agree">

                    I agree to the Terms and Conditions

                </label>

            </div>

            <button
                type="submit"
                [disabled]="enrollForm.invalid">

                Submit Enrollment

            </button>

        </form>

    </div>

</div>
